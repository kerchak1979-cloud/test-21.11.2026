            padding: 20px;
        }

            text-align: center;

        }

            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        select {
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .question-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            padding: 12px 15px;
            text-align: left;
            background-color: #eef2f5;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }
        .option-btn:hover:not(.disabled) {
            background-color: #dfe6ed;
        }
        /* Стили для правильных/неправильных ответов */
        .correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .incorrect {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .disabled {
            cursor: default;
            opacity: 0.7;
        }
        .explanation {
            margin-top: 20px;
            padding: 15px;
            background-color: #e2e6ea;
            border-left: 5px solid #2c3e50;
            display: none; /* Скрыто по умолчанию */
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        button.nav-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button.nav-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .progress {
            text-align: center;
            margin-top: 10px;
            color: #666;

        </div>
    </div>

        <button class="nav-btn" id="prevBtn" onclick="changeQuestion(-1)">← Назад</button>

        options: ["повышенной скорости инвентаризации", "оптимизации складского пространства", "четкой координации работы каждого сотрудника", "повышению налоговых выплат"],
        correct: 1,
        expl: "Оптимизация пространства."
    },
    {
        ticket: 20,
        q: "Для успешной поддержки и развития технологий ИИ в ритейле необходимо (выберите два ответа):",
        options: ["оценивать результаты внедрения и вносить изменения в стратегии на основе анализа данных", "развивать быструю и надёжную доставку", "использовать программы лояльности", "регулярно обновлять системы и решать возникающие проблемы оперативно"],
        correct: [0, 3],
        isMulti: true,
        expl: "Анализ данных и техподдержка."
    }
];

let currentTicket = 1;
let currentQuestionIndex = 0;
let filteredQuestions = [];

// Инициализация
window.onload = function() {
    const select = document.getElementById('ticketSelect');
    for (let i = 1; i <= 20; i++) {
        let option = document.createElement('option');
        option.value = i;
        option.text = 'Билет №' + i;
        select.appendChild(option);
    }
    loadTicket();
};

function loadTicket() {
    currentTicket = parseInt(document.getElementById('ticketSelect').value);
    filteredQuestions = database.filter(q => q.ticket === currentTicket);
    currentQuestionIndex = 0;
    showQuestion();
}

function changeQuestion(direction) {
    currentQuestionIndex += direction;
    if (currentQuestionIndex < 0) currentQuestionIndex = 0;
    if (currentQuestionIndex >= filteredQuestions.length) currentQuestionIndex = filteredQuestions.length - 1;
    showQuestion();
}

function showQuestion() {
    const q = filteredQuestions[currentQuestionIndex];
    
    // Обновление текста вопроса
    document.getElementById('questionText').innerText = `${currentQuestionIndex + 1}. ${q.q}`;
    document.getElementById('progressText').innerText = `Вопрос ${currentQuestionIndex + 1} из ${filteredQuestions.length}`;
    
    // Сброс стилей и пояснений
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    document.getElementById('explanationBox').style.display = 'none';
    
    // Кнопки навигации
    document.getElementById('prevBtn').disabled = (currentQuestionIndex === 0);
    document.getElementById('nextBtn').disabled = (currentQuestionIndex === filteredQuestions.length - 1);

    // Генерация кнопок ответов
    q.options.forEach((opt, index) => {
        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index, q, btn);
        container.appendChild(btn);
    });
}

function checkAnswer(selectedIndex, questionObj, btnElement) {
    // Блокируем все кнопки
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.classList.add('disabled'));
    buttons.forEach(b => b.onclick = null);

    let isCorrect = false;

    if (questionObj.isMulti) {
        // Множественный выбор
        const correctIndices = questionObj.correct;
        if (correctIndices.includes(selectedIndex)) {
            btnElement.classList.add('correct');
            isCorrect = true;
        } else {
            btnElement.classList.add('incorrect');
        }
        // Подсветим остальные правильные, если пользователь ошибся
        if (!isCorrect) {
             correctIndices.forEach(idx => {
                 buttons[idx].classList.add('correct');
             });
        }
    } else {
        // Одиночный выбор
        if (selectedIndex === questionObj.correct) {
            btnElement.classList.add('correct');
            isCorrect = true;
        } else {
            btnElement.classList.add('incorrect');
            // Подсветим правильный
            buttons[questionObj.correct].classList.add('correct');
        }
    }

    // Показываем пояснение
    const explBox = document.getElementById('explanationBox');
    const corrText = document.getElementById('correctAnswerText');
    const explText = document.getElementById('explanationText');

    explBox.style.display = 'block';
    
    if (questionObj.isMulti) {
        let answersText = questionObj.correct.map(i => questionObj.options[i]).join(', ');
        corrText.innerText = answersText;
    } else {
        corrText.innerText = questionObj.options[questionObj.correct];
    }
    
    explText.innerText = questionObj.expl;
}
</script>
